# Renders the website and publishes it to the gh-pages branch, which GitHub
# Pages serves. Runs on every push to master, or by hand from the Actions tab.
# On a pull request it only renders, as a check that every page still builds.
# Adapted from the publish.yml in Dialysis-facility-density-USRDS, following
# the r-analysis-workflow plugin's "Published by a workflow" route.
#
# The pages never run the analysis: analysis chunks are imported with
# knitr::read_chunk() and shown with eval: false, and the results pages read
# the gt tables committed as .rds in the abstract and letter folders. This
# machine has no PDFs, reviewer sheets, model outputs or API keys, and makes no
# model calls. A failed render publishes nothing, so the last good site stays
# live.

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:
    branches: master

name: Publish website

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned so a new Quarto release can't change the site unseen; to move
          # to a newer version, change this line in a pull request.
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The packages "R/Analysis setup.R" loads (the results pages source it),
      # plus knitr and rmarkdown for the chunks. System libraries such as
      # poppler for pdftools are installed automatically. Current CRAN versions.
      - name: Install the R packages the pages use
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::readxl
            any::writexl
            any::janitor
            any::irr
            any::gtsummary
            any::gt
            any::officer
            any::flowchart
            any::ellmer
            any::pdftools
            any::rstudioapi
            any::patchwork

      - name: Render (pull requests only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
